[project]
name = "nanoprot"
version = "0.1.0"
description = "A minimal, hackable, config-driven training framework for protein language models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "H. Yagiz Devre" },
]
keywords = [
    "protein language models",
    "transformer",
    "training",
    "interpretability",
    "uniref50",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# v0.1 — config-system scaffold only. Training-side deps (torch, flash-attn,
# datasets, …) are added in v0.2 when the actual training loop lands.
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ygzdvr/nanoprot"
Repository = "https://github.com/ygzdvr/nanoprot"
Issues = "https://github.com/ygzdvr/nanoprot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanoprot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # we let line-length handle long lines

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
