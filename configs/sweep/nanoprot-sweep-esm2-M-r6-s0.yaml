# AUTO-GENERATED data-budget sweep (esm2 M, ratio=6 -> D=0.88B residues, 1687 steps).
# Intermediate model-only checkpoints every 168 steps (~10) + final.
# For L(N,D) scaling. Regenerate: python -m scripts.gen_sweep_configs

name: nanoprot-sweep-esm2-M-r6-s0
seed: 0
model:
  arch: esm2
  depth: 30
  d_model: 640
  head_dim: 32
  max_seq_len: 512
  vocab_size: 33
  layer_norm: layernorm
  mlp_activation: gelu
tokenizer:
  name: esm2
data:
  dataset: uniref50
  shard_dir: ${NANOPROT_BASE_DIR}/uniref50_parquet
  packing: bos_aligned_best_fit
  val_shard: last
optimizer:
  name: muon_adamw
  weight_decay: 0.1
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
training:
  objective: mlm
  total_residues: null
  param_data_ratio: 6.0
  total_batch_size: 524288
  device_batch_size: 16
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  precision: bf16
  flash_attention: false
  mlm_probability: 0.15
eval:
  eval_every: 10
  eval_tokens: 524288
  metric: bpr
  compute_accuracy: true
logging:
  run_name: sweep-esm2-M-r6-s0
  wandb_project: nanoprot
  wandb_mode: offline
  history: true
  log_every: 1
checkpointing:
  output_dir: ${NANOPROT_BASE_DIR}/sweep/nanoprot-sweep-esm2-M-r6-s0
  save_every: 168
  save_steps: []
