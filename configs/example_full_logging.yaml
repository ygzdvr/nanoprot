# Example: FULL per-step logging + fine validation. The four flags that
# turn it on are logging.history/log_every and eval.eval_every/compute_accuracy.
# Produces history.jsonl -> visualise with: python -m scripts.plot_training_run

name: example-full-logging
seed: 0
model:
  arch: gpt2
  depth: 9
  d_model: 576
  head_dim: 64
  max_seq_len: 512
  vocab_size: 33
  rope: true
  qk_norm: true
  mlp_activation: relu_squared
  logit_softcap: 15.0
  window_pattern: L
tokenizer:
  name: esm2
data:
  dataset: uniref50
  shard_dir: ${NANOPROT_BASE_DIR}/uniref50_parquet
  packing: bos_aligned_best_fit
  val_shard: last
optimizer:
  name: muon_adamw
  weight_decay: 0.1
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
training:
  objective: ar
  total_residues: null
  param_data_ratio: 12
  total_batch_size: 524288
  device_batch_size: 32
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  precision: bf16
  flash_attention: true
eval:
  eval_every: 10
  eval_tokens: 524288
  metric: bpr
  compute_accuracy: true
logging:
  run_name: full-logging
  wandb_project: nanoprot
  wandb_mode: offline
  history: true
  log_every: 1
checkpointing:
  output_dir: ${NANOPROT_BASE_DIR}/runs/example-full-logging
  save_every: -1
  save_steps: []
