# Small Mamba (selective SSM) config for protein autoregressive modelling.
# ~30M parameter scale: depth=12, d_model=768, d_state=16, expand=2.
# Causal by construction (the SSM scan + depthwise conv only read past
# tokens), so the AR objective dispatches directly to this model.

name: nanoprot-mamba-small-uniref50
seed: 42

model:
  arch: mamba
  depth: 12
  d_model: 768         # also auto-derivable from 64*depth, but pinned for clarity
  d_state: 16
  d_conv: 4
  expand: 2
  dt_rank: null        # null = max(d_model // 16, 1) = 48
  max_seq_len: 512
  vocab_size: 50256
  layer_norm: rmsnorm

tokenizer:
  name: bpe

data:
  dataset: uniref50
  shard_dir: ${NANOPROT_BASE_DIR}/uniref50_parquet
  packing: bos_aligned_best_fit
  val_shard: last

optimizer:
  name: muon_adamw
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.0

training:
  objective: ar
  total_residues: null         # null = derive from param_data_ratio * params
  param_data_ratio: 12
  total_batch_size: 524288
  device_batch_size: 16
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  precision: bf16
  flash_attention: true        # Mamba doesn't use attention but the flag is harmless

eval:
  eval_every: 250
  eval_tokens: 41943040
  metric: bpr

logging:
  run_name: mamba-small
  wandb_project: nanoprot
  wandb_mode: offline

checkpointing:
  output_dir: ${NANOPROT_BASE_DIR}/checkpoints/mamba_small
  save_every: -1
  save_steps: []
