# ESM-2 650M-class config: depth=33, d_model=1280, n_heads=20.
# Matches the public ESM-2 650M (facebook/esm2_t33_650M_UR50D) architectural
# footprint so direct head-to-head comparisons are clean.

name: nanoprot-esm2-650M-uniref50
seed: 42

model:
  arch: esm2
  depth: 33
  d_model: 1280
  n_heads: 20
  head_dim: 64
  max_seq_len: 1024
  vocab_size: 33
  layer_norm: layernorm
  mlp_activation: gelu

tokenizer:
  name: esm2

data:
  dataset: uniref50
  shard_dir: ${NANOPROT_BASE_DIR}/uniref50_parquet
  packing: bos_aligned_best_fit
  val_shard: last

optimizer:
  name: muon_adamw
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.01

training:
  objective: mlm
  mlm_probability: 0.15
  total_residues: null
  param_data_ratio: 12
  total_batch_size: 524288
  device_batch_size: 8
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  precision: bf16
  flash_attention: true

eval:
  eval_every: 250
  eval_tokens: 41943040
  metric: bpr

logging:
  run_name: esm2-650M
  wandb_project: nanoprot
  wandb_mode: offline

checkpointing:
  output_dir: ${NANOPROT_BASE_DIR}/checkpoints/esm2_650M
  save_every: -1
  save_steps: []
