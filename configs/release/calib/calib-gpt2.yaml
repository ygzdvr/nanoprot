# AUTO-GENERATED throughput probe (gpt2, S scale, ~120 steps).
# Run via runs/calibrate_throughput.slurm; read tok/s from the log.

name: calib-gpt2
seed: 0
model:
  arch: gpt2
  depth: 9
  d_model: 576
  head_dim: 64
  max_seq_len: 512
  vocab_size: 33
  rope: true
  qk_norm: true
  mlp_activation: relu_squared
  logit_softcap: 15.0
  window_pattern: L
tokenizer:
  name: esm2
data:
  dataset: uniref50
  shard_dir: ${NANOPROT_BASE_DIR}/uniref50_parquet
  packing: bos_aligned_best_fit
  val_shard: last
optimizer:
  name: muon_adamw
  weight_decay: 0.1
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
training:
  objective: ar
  total_residues: 62914560
  param_data_ratio: 12
  total_batch_size: 524288
  device_batch_size: 32
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  precision: bf16
  flash_attention: true
eval:
  eval_every: 50
  eval_tokens: 1048576
  metric: bpr
logging:
  run_name: calib-gpt2
  wandb_project: nanoprot
  wandb_mode: offline
checkpointing:
  output_dir: ${NANOPROT_BASE_DIR}/release/_calib/gpt2
  save_every: -1
  save_steps: []
